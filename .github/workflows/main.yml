name: Test WxPusher

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send WxPusher message
        run: |
          curl "https://wxpusher.zjiecode.com/api/send/message/${{ secrets.WXPUSHER_SPT }}/Hello%20from%20GitHub"name: Test WxPusher

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test
            - name: Send WxPusher message
      run: |
        curl -X POST "https://wxpusher.zjiecode.com/api/send/message" \
          -H "Content-Type: application/json" \
          -d '{
            "appToken": "${{ secrets.WXPUSHER_APP_TOKEN }}",
            "content": "测试成功！GitHub Actions 已经可以发送 WxPusher 消息了。",
            "summary": "股票监控测试",
            "contentType": 1,
            "uids": ["${{ secrets.WXPUSHER_UID }}"]
          }'
